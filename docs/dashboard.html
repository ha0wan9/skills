<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Board</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --ink: #1f2933;
      --muted: #65717d;
      --line: #d7d9d2;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-soft: #d9f1ed;
      --warn: #a15c00;
      --done: #2f6f46;
      --shadow: 0 1px 2px rgba(20, 28, 35, 0.08);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); }
    header { padding: 24px clamp(16px, 4vw, 44px) 16px; border-bottom: 1px solid var(--line); background: #fbfbf8; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 34px); line-height: 1.12; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    p { margin: 0; }
    .meta { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; max-width: 780px; }
    .count { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: var(--shadow); min-height: 76px; }
    .count strong { display: block; font-size: 24px; line-height: 1.1; }
    .count span { color: var(--muted); font-size: 13px; }
    main { padding: 22px clamp(16px, 4vw, 44px) 36px; display: grid; gap: 22px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 8px 10px; font: inherit; cursor: pointer; }
    button.active { border-color: var(--accent); background: var(--accent-soft); color: #0b4d48; }
    section { min-width: 0; }
    .roadmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .milestone, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .milestone { padding: 14px; }
    .milestone .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; font-size: 12px; background: #eef0ea; color: var(--muted); white-space: nowrap; }
    .badge.now { background: var(--accent-soft); color: #0b4d48; }
    .badge.done { background: #ddf0e2; color: var(--done); }
    .badge.todo { background: #f1eee5; color: var(--warn); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .column { min-width: 0; }
    .column h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stack { display: grid; gap: 10px; }
    .card { padding: 12px; min-width: 0; }
    .card header { padding: 0; border: 0; background: transparent; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .card h4 { margin: 0 0 8px; font-size: 15px; line-height: 1.25; letter-spacing: 0; overflow-wrap: anywhere; }
    .card .body { color: var(--muted); font-size: 13px; line-height: 1.42; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; font-size: 12px; color: var(--muted); background: #fbfbf8; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; font-size: 13px; }
    footer { color: var(--muted); font-size: 12px; padding: 0 clamp(16px, 4vw, 44px) 30px; }
    .wiki { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 16px; align-items: start; }
    .wiki-nav { display: grid; gap: 4px; position: sticky; top: 12px; }
    .wiki-nav button { text-align: left; width: 100%; }
    .wiki-nav .sub { font-size: 12px; color: var(--muted); padding-left: 14px; border: 0; background: transparent; }
    .wiki-page { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 16px 20px; min-width: 0; overflow-wrap: anywhere; }
    .wiki-page h1, .wiki-page h2, .wiki-page h3 { line-height: 1.2; }
    .wiki-page pre { background: #f3f4ee; border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; }
    .wiki-page code { background: #f3f4ee; border-radius: 4px; padding: 1px 4px; font-size: 13px; }
    .wiki-page pre code { background: transparent; padding: 0; }
    .wiki-page blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
    @media (max-width: 820px) {
      .counts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board { grid-template-columns: 1fr; }
      .wiki { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const BOARD_DATA = {"counts": {"active": 23, "done": 17, "items": 23, "refined": 23}, "docs": [{"headings": [{"level": 1, "slug": "skills", "text": "skills"}, {"level": 2, "slug": "skills", "text": "Skills"}, {"level": 2, "slug": "compatibility", "text": "Compatibility"}, {"level": 2, "slug": "install", "text": "Install"}, {"level": 2, "slug": "bounded-doc-loading", "text": "Bounded Doc Loading"}, {"level": 2, "slug": "local-development", "text": "Local Development"}, {"level": 2, "slug": "repo-layout", "text": "Repo Layout"}, {"level": 2, "slug": "license", "text": "License"}], "html": "\u003ch1 id=\"h-skills\"\u003eskills\u003c/h1\u003e\n\u003cp\u003eAgent harness skills published as a Claude Code plugin marketplace. The repo follows the \u003ca href=\"https://github.com/anthropics/skills\"\u003e\u003ccode\u003eanthropics/skills\u003c/code\u003e\u003c/a\u003e layout: a flat \u003ccode\u003eskills/\u0026lt;name\u0026gt;/\u003c/code\u003e directory plus a \u003ccode\u003e.claude-plugin/marketplace.json\u003c/code\u003e declaring each installable plugin.\u003c/p\u003e\n\u003cp\u003eEach skill in \u003ccode\u003eskills/\u003c/code\u003e is independently installable by name. The plugin manifest at \u003ca href=\".claude-plugin/marketplace.json\"\u003e\u003ccode\u003e.claude-plugin/marketplace.json\u003c/code\u003e\u003c/a\u003e declares installable plugins, each pointing at one skill directory.\u003c/p\u003e\n\u003ch2 id=\"h-skills\"\u003eSkills\u003c/h2\u003e\n\u003cp\u003e| Plugin | Path | Description | |---|---|---| | \u003ccode\u003eproject-meta\u003c/code\u003e | \u003ca href=\"skills/project-meta/\"\u003e\u003ccode\u003eskills/project-meta/\u003c/code\u003e\u003c/a\u003e | Bootstrap, audit, and evolve a repository agent-work harness — canonical memory, execution rules, multi-agent protocols, project-specific artifact instantiation, pre-commit delivery. Surface commands: \u003ccode\u003e/project-meta init\u003c/code\u003e, \u003ccode\u003e/project-meta plan\u003c/code\u003e, \u003ccode\u003e/project-meta status\u003c/code\u003e, \u003ccode\u003e/project-meta validate\u003c/code\u003e, \u003ccode\u003e/project-meta deliver\u003c/code\u003e, \u003ccode\u003e/project-meta audit\u003c/code\u003e, \u003ccode\u003e/project-meta settings\u003c/code\u003e. | | \u003ccode\u003edl-research\u003c/code\u003e | \u003ca href=\"skills/dl-research/\"\u003e\u003ccode\u003eskills/dl-research/\u003c/code\u003e\u003c/a\u003e | Rigorous Deep Learning research workflows: frame, survey, design, prepare, launch, monitor, evaluate, synthesize, audit, plus a bounded autonomous ratchet loop. Project-agnostic; uses an adapter for backend integration. | | \u003ccode\u003edeep-survey-bfs\u003c/code\u003e | \u003ca href=\"skills/deep-survey-bfs/\"\u003e\u003ccode\u003eskills/deep-survey-bfs/\u003c/code\u003e\u003c/a\u003e | Breadth-first literature surveys with hard coverage gates: frame → Round 1 broad search → gap audit (sub-question × dimension matrix) → Round N gap-fill → synthesize multi-axis taxonomy + per-paper deep-dives + multi-tier reading list. Anti-hallucination via \u003ccode\u003eclaims.jsonl\u003c/code\u003e contract. | | \u003ccode\u003eprofile-creator\u003c/code\u003e | \u003ca href=\"skills/profile-creator/\"\u003e\u003ccode\u003eskills/profile-creator/\u003c/code\u003e\u003c/a\u003e | Create isolated Claude Code config profiles that share one plugin store through a centralized \u003ccode\u003eccplug\u003c/code\u003e admin wrapper. | | \u003ccode\u003ecalendar-crud-workflow\u003c/code\u003e | \u003ca href=\"skills/calendar-crud-workflow/\"\u003e\u003ccode\u003eskills/calendar-crud-workflow/\u003c/code\u003e\u003c/a\u003e | Standardize calendar event CRUD from fuzzy scheduling requests into stable calendars, title prefixes, searchable tags, source links, and safe batch operations. | | \u003ccode\u003esketch-asset-generator\u003c/code\u003e | \u003ca href=\"skills/sketch-asset-generator/\"\u003e\u003ccode\u003eskills/sketch-asset-generator/\u003c/code\u003e\u003c/a\u003e | Turn sketches or existing UI source into reviewable design-system asset packs (tokens, SVG/component primitives, manifests, contact sheets, validation reports). Extraction-first: extract directly from user-owned resources by default, use GPT Image only as a fallback. Runs under Claude or Codex. | | \u003ccode\u003emeta-debug\u003c/code\u003e | \u003ca href=\"skills/meta-debug/\"\u003e\u003ccode\u003eskills/meta-debug/\u003c/code\u003e\u003c/a\u003e | A gated, rollbackable, looping debug pipeline: triage \u0026amp; mitigate → bounded clean-context case file → deterministic repro → red test (reuse existing CI/suite) → falsifiable hypotheses → constraint-scored solutions → top-k parallel sandbox fixes → adversarial-critic validation → canary with a predefined rollback trigger → recorded lesson. Phase gates enforced by a stdlib session tracker; composes with \u003ccode\u003eproject-meta\u003c/code\u003e for context-collection, multi-agent dispatch, and lesson promotion. | | \u003ccode\u003eopenclaw-devops\u003c/code\u003e | \u003ca href=\"skills/openclaw-devops/\"\u003e\u003ccode\u003eskills/openclaw-devops/\u003c/code\u003e\u003c/a\u003e | OpenClaw install maintenance: sanity/health probe, bounded self-repair, transactional auto-update across all npm copies with post-update integrity verification + automatic rollback, an ops lessons journal, and a thin maintenance cron. Delegates systematic debugging to \u003ccode\u003emeta-debug\u003c/code\u003e (the debug base layer) and supplies the OpenClaw \u003ccode\u003ereproduce\u003c/code\u003e/\u003ccode\u003everify\u003c/code\u003e/\u003ccode\u003erollback\u003c/code\u003e mechanics its phases call. |\u003c/p\u003e\n\u003ch2 id=\"h-compatibility\"\u003eCompatibility\u003c/h2\u003e\n\u003cp\u003eThe \u003ccode\u003eSKILL.md\u003c/code\u003e format is portable across runtimes (Claude Code, \u003ca href=\"https://developers.openai.com/codex/skills\"\u003eCodex\u003c/a\u003e, \u003ca href=\"https://docs.openclaw.ai/tools/skills\"\u003eOpenClaw\u003c/a\u003e / \u003ca href=\"https://github.com/openclaw/clawhub\"\u003eClawHub\u003c/a\u003e). Two independent axes are tracked per skill in each \u003ccode\u003eSKILL.md\u003c/code\u003e frontmatter under \u003ccode\u003emetadata\u003c/code\u003e (mirrored here and in \u003ccode\u003emarketplace.json\u003c/code\u003e):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003ecompat\u003c/code\u003e\u003c/strong\u003e — runtimes the skill \u003cem\u003eruns on\u003c/em\u003e (capability).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003epublished\u003c/code\u003e\u003c/strong\u003e — registries where it is \u003cem\u003elive\u003c/em\u003e today (distribution).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cpre\u003e\u003ccode\u003emetadata:\n  compat: [claude-code, codex, openclaw]   # runs on\n  published: [claude-marketplace]          # live in\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e| Plugin | Claude Code | Codex | OpenClaw | Published | |---|:--:|:--:|:--:|---| | \u003ccode\u003ecalendar-crud-workflow\u003c/code\u003e | ✅ | ✅ | ❌ | Claude Marketplace | | \u003ccode\u003edeep-survey-bfs\u003c/code\u003e | ✅ | ✅ | ❌ | Claude Marketplace | | \u003ccode\u003edl-research\u003c/code\u003e | ✅ | ✅ | ❌ | Claude Marketplace | | \u003ccode\u003emeta-debug\u003c/code\u003e | ✅ | ✅ | ✅ | Claude Marketplace | | \u003ccode\u003eopenclaw-devops\u003c/code\u003e | ✅ | ✅ | ✅ | Claude Marketplace | | \u003ccode\u003eproject-meta\u003c/code\u003e | ✅ | ✅ | ⚠️ | Claude Marketplace | | \u003ccode\u003esketch-asset-generator\u003c/code\u003e | ✅ | ✅ | ❌ | Claude Marketplace | | \u003ccode\u003eprofile-creator\u003c/code\u003e | ✅ | ❌ | ❌ | Claude Marketplace |\u003c/p\u003e\n\u003cp\u003e✅ supported · ⚠️ untested (installs Claude Code / Codex harness artifacts) · ❌ not supported by design. \u003ccode\u003eprofile-creator\u003c/code\u003e manages Claude Code config dirs (\u003ccode\u003e~/.claude-\u0026lt;name\u0026gt;\u003c/code\u003e, \u003ccode\u003eCLAUDE_CONFIG_DIR\u003c/code\u003e, \u003ccode\u003eccplug\u003c/code\u003e) and is intrinsically Claude-Code-only. All skills are currently published only to the Claude Code marketplace; \u003ccode\u003ecompat\u003c/code\u003e runtimes beyond that are format-portable but not yet listed in their native registries.\u003c/p\u003e\n\u003ch2 id=\"h-install\"\u003eInstall\u003c/h2\u003e\n\u003cp\u003eThis repo is a Claude Code plugin marketplace. Install the marketplace once, then install any plugin by name.\u003c/p\u003e\n\u003cp\u003eFrom a git repo URL (\u003ccode\u003egit@github.com:ha0wan9/skills.git\u003c/code\u003e or \u003ccode\u003ehttps://github.com/ha0wan9/skills\u003c/code\u003e):\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e/plugin marketplace add ha0wan9/skills\n/plugin install project-meta@ha0wan9-skills\n/plugin install dl-research@ha0wan9-skills\n/plugin install deep-survey-bfs@ha0wan9-skills\n/plugin install profile-creator@ha0wan9-skills\n/plugin install calendar-crud-workflow@ha0wan9-skills\n/plugin install sketch-asset-generator@ha0wan9-skills\n/plugin install meta-debug@ha0wan9-skills\n/plugin install openclaw-devops@ha0wan9-skills\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEach \u003ccode\u003e/plugin install\u003c/code\u003e resolves the plugin name from \u003ccode\u003e.claude-plugin/marketplace.json\u003c/code\u003e and copies the referenced skill directory into the user's plugin store. Skills install independently; you can install one without the other.\u003c/p\u003e\n\u003cp\u003eFor users who do not use the plugin marketplace, manual install copies one skill subdirectory into the agent's skills directory:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecp -R /path/to/skills/skills/project-meta    ~/.claude/skills/project-meta\ncp -R /path/to/skills/skills/dl-research     ~/.claude/skills/dl-research\ncp -R /path/to/skills/skills/deep-survey-bfs ~/.claude/skills/deep-survey-bfs\ncp -R /path/to/skills/skills/profile-creator ~/.claude/skills/profile-creator\ncp -R /path/to/skills/skills/calendar-crud-workflow ~/.claude/skills/calendar-crud-workflow\ncp -R /path/to/skills/skills/sketch-asset-generator ~/.claude/skills/sketch-asset-generator\ncp -R /path/to/skills/skills/meta-debug      ~/.claude/skills/meta-debug\ncp -R /path/to/skills/skills/openclaw-devops ~/.claude/skills/openclaw-devops\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-bounded-doc-loading\"\u003eBounded Doc Loading\u003c/h2\u003e\n\u003cp\u003eThe \u003ccode\u003eproject-meta\u003c/code\u003e skill ships \u003ccode\u003escripts/extract_doc_context.py\u003c/code\u003e for heading-first bounded reads of long shared docs. From a target repo:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 ~/.claude/skills/project-meta/scripts/extract_doc_context.py README.md --index\npython3 ~/.claude/skills/project-meta/scripts/extract_doc_context.py README.md --heading \"Install\" --query \"git repo\" --within-lines 80 --max-lines 40\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe extractor reads Markdown headings first, searches within the selected heading window, and prints a heading-first line-numbered excerpt. It uses only the Python standard library.\u003c/p\u003e\n\u003ch2 id=\"h-local-development\"\u003eLocal Development\u003c/h2\u003e\n\u003cp\u003eSkills here are versioned with the marketplace. Skills are dependency-free Python where applicable, and ship their own validators inside \u003ccode\u003eskills/\u0026lt;name\u0026gt;/scripts/\u003c/code\u003e when the validator is for end users (e.g. \u003ccode\u003edl-research/scripts/validate_ledger.py\u003c/code\u003e, \u003ccode\u003eproject-meta/scripts/validate_target_harness.py\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003eThe dev-only validator at \u003ccode\u003escripts/validate_project_meta.py\u003c/code\u003e (this repo's root, not shipped) validates the project-meta skill content under \u003ccode\u003eskills/project-meta/\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 scripts/validate_project_meta.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt checks skill metadata, reference routing, canonical memory boundaries, protocol completeness, UI metadata, prompt-based trigger cases, template provenance, the bounded doc context extractor, and the user preference renderer.\u003c/p\u003e\n\u003ch2 id=\"h-repo-layout\"\u003eRepo Layout\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003eskills/\n├── .claude-plugin/\n│   └── marketplace.json           # plugin manifest declaring installable skills\n├── README.md                      # this file\n├── AGENTS.md                      # repo-meta routing for agents working on the marketplace\n├── .gitignore\n├── scripts/\n│   └── validate_project_meta.py   # dev validator for the project-meta skill (NOT shipped)\n└── skills/                        # flat skill directory, Anthropic-pattern\n    ├── project-meta/\n    │   ├── SKILL.md\n    │   ├── USER.template.md\n    │   ├── .gitignore.template\n    │   ├── agents/openai.yaml\n    │   ├── references/\n    │   ├── templates/\n    │   └── scripts/\n    │       ├── extract_doc_context.py\n    │       ├── render_user_preferences.py\n    │       └── validate_target_harness.py\n    ├── dl-research/\n    │   ├── SKILL.md\n    │   ├── agents/openai.yaml\n    │   ├── modes/\n    │   ├── phases/\n    │   ├── references/\n    │   ├── templates/\n    │   └── scripts/validate_ledger.py\n    ├── deep-survey-bfs/\n    │   ├── SKILL.md\n    │   ├── agents/openai.yaml\n    │   ├── phases/      # 00-frame, 01-round1, 02-gap-audit, 03-roundN, 04-synthesize, 05-version\n    │   ├── references/  # source-coverage, paper-rating-rubric, coverage-matrix, claims-discipline, taxonomy-revision, bias-audit\n    │   ├── templates/   # survey-index, paper-index, coverage-matrix, survey-skeleton, claims.schema.json\n    │   └── scripts/     # arxiv_search, coverage_check, claims_validate, bias_audit\n    ├── profile-creator/\n    │   └── SKILL.md\n    ├── calendar-crud-workflow/\n    │   ├── SKILL.md\n    │   └── agents/openai.yaml\n    ├── meta-debug/\n    │   ├── SKILL.md\n    │   ├── references/  # debug-pipeline (gated phase contract; composes with project-meta)\n    │   └── scripts/     # debug_session.py (phase-gated, rollbackable session tracker)\n    ├── openclaw-devops/\n    │   ├── SKILL.md\n    │   ├── config.json  # policy + host topology\n    │   ├── references/  # runbook (upgrade/rollback/repair catalog, cron recipe, sudoers)\n    │   └── scripts/     # openclaw_devops.py (sanity/repair/update/verify/rollback/cycle/lessons)\n    └── sketch-asset-generator/\n        ├── SKILL.md\n        ├── agents/openai.yaml\n        ├── references/   # claude-design-architecture, direct-extraction-workflow, gpt-image-workflow, originality-policy, public-case-model, sketch-intake\n        ├── templates/    # asset-pack.yaml\n        ├── schemas/      # asset-pack.schema.json\n        ├── examples/     # fixtures + public-design-system structure notes\n        └── scripts/      # validate_asset_pack.py, render_contact_sheet.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe \u003ccode\u003eskills/\u0026lt;name\u0026gt;/\u003c/code\u003e flat layout mirrors \u003ccode\u003eanthropics/skills\u003c/code\u003e and is what \u003ccode\u003e/plugin install\u003c/code\u003e expects when reading \u003ccode\u003emarketplace.json\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-license\"\u003eLicense\u003c/h2\u003e\n\u003cp\u003eSkills published in this repo are MIT-licensed by the repo owner unless a \u003ccode\u003eLICENSE\u003c/code\u003e file inside a particular skill says otherwise.\u003c/p\u003e", "path": "README.md", "slug": "readme", "title": "skills"}], "generated_at": "2026-06-06T20:35:58Z", "items": [{"acceptance_shape": "Store layout exists under docs/backlog with parseable JSONL/JSON, no comment headers, and separate maturity/status/disposition/version fie     function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);

      const labels = [
        ["items", "All items"],
        ["active", "Active"],
        ["refined", "Refined"],
        ["done", "Done"]
      ];
      document.getElementById("counts").innerHTML = labels.map(([key, label]) => `
        <div class="count"><strong>${esc(BOARD_DATA.counts[key] || 0)}</strong><span>${esc(label)}</span></div>
      `).join("");
    }

    function renderRoadmap() {

      document.getElementById("roadmap").innerHTML = milestones.length ? milestones.map(m => {
        const itemTitles = (m.items || []).map(id => byId.get(id)).filter(Boolean).map(item => `<span class="chip">${esc(item.id)}</span>`).join("");
        return `<article class="milestone">
          <div class="top"><strong>${esc(m.version || m.id || "")}</strong><span class="badge ${esc(m.status || "todo")}">${esc(m.status || "todo")}</span></div>
          <h3>${esc(m.title || "")}</h3>
          <p class="meta">${esc(m.detail || "")}</p>
          <div class="chips">${itemTitles}</div>
        </article>`;
      }).join("") : `<div class="empty">No roadmap milestones yet.</div>`;
    }

    function renderFilters() {
      const filters = ["active", "deferred", "trimmed", "wontfix", "all"];
      document.getElementById("filters").innerHTML = filters.map(value => `
        <button type="button" class="${activeDisposition === value ? "active" : ""}" data-filter="${value}">${esc(value)}</button>
      `).join("");
      document.querySelectorAll("[data-filter]").forEach(button => {
        button.addEventListener("click", () => {
          activeDisposition = button.dataset.filter;
          render();
        });
      });
    }

    function visibleItems() {
      if (activeDisposition === "all") return BOARD_DATA.items;
      return BOARD_DATA.items.filter(item => item.disposition === activeDisposition);
    }

    function renderBoard() {
      const items = visibleItems();
      document.getElementById("board").innerHTML = STATUSES.map(status => {
        const cards = items.filter(item => item.status === status);
        return `<div class="column">
          <h3>${esc(status)} (${cards.length})</h3>
          <div class="stack">${cards.length ? cards.map(renderCard).join("") : `<div class="empty">No items.</div>`}</div>
        </div>`;
      }).join("");
    }

    function renderCard(item) {
      const labels = [...(item.labels || []), item.kind, item.maturity, item.version].filter(Boolean);
      return `<article class="card">
        <header><h4>${esc(item.id)} · ${esc(item.title)}</h4><span class="badge">${esc(item.disposition)}</span></header>
        ${item.acceptance_shape ? `<p class="body">${esc(item.acceptance_shape)}</p>` : ""}
        ${item.body ? `<p class="body">${esc(item.body)}</p>` : ""}
        <div class="chips">${labels.map(label => `<span class="chip">${esc(label)}</span>`).join("")}</div>
      </article>`;
    }

    let activeDoc = null;

    function renderDocs() {
      const docs = BOARD_DATA.docs || [];
      const section = document.getElementById("wiki-section");
      if (!docs.length) { section.style.display = "none"; return; }
      section.style.display = "";
      if (!activeDoc || !docs.some(d => d.slug === activeDoc)) activeDoc = docs[0].slug;
      const current = docs.find(d => d.slug === activeDoc) || docs[0];
      document.getElementById("wiki-nav").innerHTML = docs.map(d => {
        const subs = (d.headings || []).filter(h => h.level === 2)
          .map(h => `<button type="button" class="sub" data-doc="${esc(d.slug)}" data-anchor="h-${esc(h.slug)}">${esc(h.text)}</button>`).join("");
        return `<button type="button" class="${d.slug === activeDoc ? "active" : ""}" data-doc="${esc(d.slug)}">${esc(d.title)}</button>${d.slug === activeDoc ? subs : ""}`;
      }).join("");
      // current.html is renderer-produced, pre-escaped HTML (board.py md_to_html escapes the
      // source first), so innerHTML is the intended sink here — do NOT esc() it.
      document.getElementById("wiki-page").innerHTML = current.html;
      document.querySelectorAll("#wiki-nav [data-doc]").forEach(b => b.addEventListener("click", () => {
        activeDoc = b.dataset.doc; renderDocs();
        if (b.dataset.anchor) { const el = document.getElementById(b.dataset.anchor); if (el) el.scrollIntoView(); }
      }));
      document.querySelectorAll("#wiki-page [data-wikilink]").forEach(a => a.addEventListener("click", ev => {
        const target = docs.find(d => d.slug === a.dataset.wikilink);
        if (target) { ev.preventDefault(); activeDoc = target.slug; renderDocs(); }
      }));
    }

    function render() {
      document.getElementById("meta").textContent = `Generated ${BOARD_DATA.generated_at} from ${BOARD_DATA.source_reference}`;
      document.getElementById("footer").textContent = `Store: ${BOARD_DATA.store.items} · ${BOARD_DATA.store.roadmap}`;
      renderCounts();
      renderRoadmap();
      renderFilters();
      renderBoard();
      renderDocs();
    }

    render();
  </script>
</body>
</html>
